<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelajah.In | Pemesanan Tiket Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: { primary: '#2b6c94', secondary: '#f39c12' },
            borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
          }
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Quicksand", sans-serif; background: #fdfdfd; color: #2d3e50; line-height: 1.6; overflow-x: hidden; transition: background 0.3s ease, color 0.2s ease; }
      
      /* --- NAVBAR PREMIUM --- */
      .navbar {
          background: rgba(177, 172, 172, 0.85); 
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          padding: 1rem 5%; 
          box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
          display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; 
          position: sticky; top: 0; z-index: 50; 
          transition: all 0.3s ease;
      }
      .logo { font-size: 1.8rem; font-weight: 700; color: #2b6c94; cursor: pointer; transition: transform 0.3s; }
      .logo:hover { transform: scale(1.05); }
      .logo i { color: #f39c12; margin-right: 5px; animation: spin-slow 10s linear infinite; }
      @keyframes spin-slow { 100% { transform: rotate(360deg); } }
      .nav-links { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
      .nav-links a { text-decoration: none; color: #2d3e50; font-weight: 600; transition: all 0.3s ease; cursor: pointer; position: relative; }
      .nav-links a::after {
          content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0;
          background-color: #f39c12; transition: width 0.3s ease;
      }
      .nav-links a:hover { color: #2b6c94; }
      .nav-links a:hover::after { width: 100%; }
      .btn-outline { border: 2px solid #2b6c94; padding: 0.5rem 1.2rem; border-radius: 50px; color: #2b6c94; font-weight: 600; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: transparent; cursor: pointer; display: inline-block; text-decoration: none; }
      .btn-outline:hover { background: #2b6c94; color: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(43, 108, 148, 0.2); }

      /* --- HERO SECTION --- */
      .hero {
          position: relative; height: 100vh; min-height: 550px; width: 100%;
          display: flex; align-items: center; justify-content: center; text-align: center;
          padding: 0 1rem; background-size: cover; background-position: center;
          transition: background-image 1s ease-in-out;
      }
      .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0, 20, 40, 0.7), rgba(0, 40, 70, 0.5)); z-index: 1; }
      .hero-content { position: relative; z-index: 2; color: white; max-width: 800px; margin: 0 auto; }
      .hero-content h1 { font-size: 3.5rem; margin-bottom: 0.5rem; text-shadow: 2px 4px 10px rgba(0,0,0,0.5); min-height: 120px; animation: slideDown 0.8s ease-out; }
      .hero-content p { font-size: 1.2rem; margin-bottom: 2.5rem; animation: fadeIn 1.2s ease-out; }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      
      .cursor { display: inline-block; width: 4px; margin-left: 2px; background-color: #f39c12; animation: blink 0.7s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      
      .search-box { background: white; border-radius: 60px; padding: 0.5rem 0.5rem 0.5rem 2rem; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 10px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); transition: all 0.3s; }
      .search-box input { border: none; padding: 0.8rem 0; font-size: 1.1rem; min-width: 300px; outline: none; background: transparent; color: #1e3c5c; }
      .search-box button { background: #f39c12; border: none; padding: 1rem 2.5rem; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; transition: all 0.3s; }

      /* --- SECTION & CARDS --- */
      .section-title { text-align: center; margin: 4rem 0 3rem; font-size: 2.5rem; font-weight: 800; color: #1e3c5c; position: relative; }
      .section-title:after { content: ""; display: block; width: 80px; height: 5px; background: #f39c12; margin: 1rem auto; border-radius: 10px; }
      
      .destinasi-container, .paket-container { max-width: 1300px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 35px; }
      
      .card, .paket-card { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: all 0.4s; cursor: pointer; position: relative; top: 0; }
      .card:hover { top: -12px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
      
      .card-img { height: 220px; position: relative; overflow: hidden; }
      .card-img img { position: absolute; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
      .card:hover .card-img img { transform: scale(1.1); }
      .rating { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 6px 12px; border-radius: 50px; color: white; z-index: 3; }
      
      .card-content { padding: 25px; }
      .price { font-size: 1.6rem; font-weight: 800; color: #2b6c94; margin: 15px 0; }
      .btn-card { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border: none; padding: 12px 0; width: 100%; border-radius: 14px; font-weight: 700; cursor: pointer; }

      .paket-section { background: #f8fafc; padding: 4rem 5%; }
      .paket-card { padding: 2.5rem; text-align: center; }
      .paket-card i { font-size: 3rem; color: #f39c12; margin-bottom: 1.5rem; }

      .tw-input { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; outline: none; }
      .tw-label { display: block; font-weight: 700; margin-bottom: 8px; color: #374151; }

      .kontak-section { background: linear-gradient(135deg, #1e3c5c, #2b6c94); color: white; padding: 4rem 5%; }
      .toast { visibility: hidden; min-width: 300px; background: rgba(39, 174, 96, 0.95); color: white; text-align: center; border-radius: 50px; padding: 18px; position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 20px); z-index: 999; transition: all 0.4s; }
      .toast.show { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
      
      .hidden { display: none; }
    </style>
</head>
<body>

<div id="page-home" class="page-view active">
    <nav class="navbar">
        <div class="logo" onclick="navigateTo('page-home')">
            <i class="fas fa-compass"></i> Jelajah.In!
        </div>
        <div class="nav-links">
            <a onclick="scrollToSection('beranda')">Beranda</a>
            <a onclick="scrollToSection('destinasi')">Destinasi</a>
            <a onclick="scrollToSection('paket')">Paket</a>
            <a onclick="scrollToSection('kontak')">Kontak</a>
            
            <div id="auth-section">
                <!-- SESUAI STRUKTUR: api/server/login.php -->
                <a href="api/server/login.php" id="btn-login" class="btn-outline">
                    <i class="fas fa-user-circle mr-1"></i> Masuk / Daftar
                </a>
                
                <div id="user-info" class="hidden items-center gap-4">
                    <span class="text-primary font-bold bg-blue-50 px-4 py-2 rounded-full border border-blue-100 shadow-sm">
                        <i class="fas fa-user-check text-[#f39c12] mr-2"></i>Halo, <span id="display-username">User</span>
                    </span>
                    <!-- SESUAI STRUKTUR: api/server/logout.php -->
                    <a href="api/server/logout.php" class="text-red-500 hover:text-red-700 font-bold" onclick="return confirm('Yakin ingin logout?')">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero" id="beranda">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1><span id="typing-text"></span><span class="cursor">|</span></h1>
            <p>Eksplorasi destinasi terbaik dengan harga termurah. Liburan impian Anda dimulai dari sini!</p>
            <div class="search-box">
                <i class="fas fa-search text-gray-400 ml-2"></i>
                <input type="text" placeholder="Mau liburan kemana bulan ini?" id="searchInput" />
                <button onclick="search()">Cari Destinasi</button>
            </div>
        </div>
    </section>

    <h2 class="section-title" id="destinasi">Destinasi Terfavorit</h2>
    <div class="destinasi-container" id="destinasiContainer"></div>

    <section class="paket-section" id="paket">
        <h2 class="section-title">Paket Wisata Spesial</h2>
        <div class="paket-container" id="paketContainer"></div>
    </section>

    <section class="kontak-section" id="kontak">
        <div class="text-center mt-12 text-blue-200 text-sm border-t border-white/20 pt-6">
            &copy; 2026 JELAJAH.IN Hak Cipta Dilindungi.
        </div>
    </section>
</div>

<!-- Modal / Page Destinasi Detail -->
<div id="page-destinasi" class="page-view hidden bg-gray-50 min-h-screen pb-12">
    <!-- Konten Detail Sama Seperti Sebelumnya -->
    <div class="p-4 bg-white shadow-sm sticky top-0 z-40">
        <button onclick="navigateTo('page-home')" class="text-primary font-bold"><i class="fas fa-arrow-left"></i> Kembali</button>
    </div>
    <div class="max-w-6xl mx-auto p-4">
        <h1 id="destTitle" class="text-4xl font-bold text-[#1e3c5c]">Nama Destinasi</h1>
        <p id="destDesc" class="mt-4 text-gray-600"></p>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- DATA ---
const destinations = [
    { 
        id: 1, 
        name: "Gunung Bromo", 
        location: "Jawa Timur", 
        price: 75000, 
        rating: 4.9, 
        // SESUAI STRUKTUR: api/server/ nama file gambar
        imgUrl: "api/bromo.jpg", 
        description: "Nikmati pemandangan matahari terbit yang ikonik di kawah Bromo." 
    },
    { 
        id: 2, 
        name: "Candi Borobudur", 
        location: "Magelang", 
        price: 50000, 
        rating: 4.8, 
        imgUrl: "api/Borobudur.jpg", 
        description: "Jelajahi kemegahan candi Buddha terbesar di dunia." 
    },
    { 
        id: 3, 
        name: "Pantai Kuta Lombok", 
        location: "Lombok", 
        price: 30000, 
        rating: 4.7, 
        imgUrl: "api/Kuta-Beach.jpg", 
        description: "Pasir putih merica dan air laut yang jernih menanti Anda." 
    }
];

const paketWisata = [
    { id: 1, nama: "Paket Keluarga", harga: 350000, icon: "fa-users", fitur: "Tiket 4 orang + makan siang" }
];

// --- STATE & AUTH LOGIC ---
// Karena ini HTML statis, kita mensimulasikan login. 
// Di aplikasi nyata, Anda bisa mengecek cookie atau memanggil API.
let isLoggedIn = false; 

function checkAuth() {
    // Karena Vercel statis, kita cek apakah ada data di localStorage yang diset oleh login.php
    const user = localStorage.getItem('username');
    if (user) {
        document.getElementById('btn-login').classList.add('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-info').classList.add('flex');
        document.getElementById('display-username').textContent = user;
    }
}

// --- NAVIGATION ---
function navigateTo(pageId) {
    document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function scrollToSection(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
    }
}

// --- RENDERING ---
function renderHome() {
    const destCont = document.getElementById("destinasiContainer");
    destCont.innerHTML = destinations.map(dest => `
        <div class="card" onclick="openDestinasi(${dest.id})">
            <div class="card-img">
                <img src="${dest.imgUrl}" alt="${dest.name}">
                <span class="rating"><i class="fas fa-star text-yellow-400"></i> ${dest.rating}</span>
            </div>
            <div class="card-content">
                <h3>${dest.name}</h3>
                <div class="price">Rp ${dest.price.toLocaleString("id-ID")}</div>
                <button class="btn-card">Pesan Sekarang</button>
            </div>
        </div>
    `).join('');
}

function openDestinasi(id) {
    if (!isLoggedIn) {
        window.location.href = 'api/login.php';
        return;
    }
    const dest = destinations.find(d => d.id === id);
    document.getElementById('destTitle').textContent = dest.name;
    document.getElementById('destDesc').textContent = dest.description;
    navigateTo('page-destinasi');
}

// --- EFFECT ---
const typingElement = document.getElementById("typing-text");
const phrases = ["Bingung Liburan Kemana?", "Di Jelajah.In!", "Pesan Tiket Murah!"];
let pIdx = 0, cIdx = 0, isDel = false;

function type() {
    const cur = phrases[pIdx];
    typingElement.textContent = isDel ? cur.substring(0, cIdx - 1) : cur.substring(0, cIdx + 1);
    cIdx += isDel ? -1 : 1;
    if (!isDel && cIdx === cur.length) { isDel = true; setTimeout(type, 2000); }
    else if (isDel && cIdx === 0) { isDel = false; pIdx = (pIdx + 1) % phrases.length; setTimeout(type, 500); }
    else { setTimeout(type, isDel ? 50 : 100); }
}

function search() {
    const val = document.getElementById('searchInput').value;
    const toast = document.getElementById('toast');
    toast.textContent = val ? `Mencari "${val}"...` : "Masukkan tujuan!";
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

document.addEventListener("DOMContentLoaded", () => {
    checkAuth();
    renderHome();
    type();
});
</script>
</body>
</html>
